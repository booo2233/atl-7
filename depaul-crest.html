<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De Paul Crest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground-0: #040a1a;
    --ground-1: #0a1936;
    --ground-2: #16377a;
    --ink: #e8eefb;
    --ink-dim: #93a6cf;
    --gold: #f3c552;
    --edge: rgba(160, 185, 235, .28);
    --f-ui: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground-0);
    color: var(--ink);
    font-family: var(--f-ui);
    overflow: hidden;
  }
  .stage {
    position: relative;
    height: 100%;
    box-sizing: border-box;
    display: grid;
    grid-template-rows: 1fr auto;
    padding-inline: 16px;
    overflow: hidden;
    background: radial-gradient(120% 90% at 50% 42%, var(--ground-2) 0%, var(--ground-1) 38%, var(--ground-0) 78%);
  }
  #dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .scene {
    position: relative;
    z-index: 1;
    display: grid;
    place-items: center;
    min-height: 0;
    perspective: 1400px;
  }
  .rays {
    position: absolute;
    left: 50%; top: 50%;
    width: min(150vmin, 1300px);
    aspect-ratio: 1;
    translate: -50% -50%;
    background: repeating-conic-gradient(from 0deg, rgba(243, 197, 82, .11) 0deg 4deg, transparent 4deg 15deg);
    -webkit-mask: radial-gradient(circle, #000 6%, transparent 60%);
    mask: radial-gradient(circle, #000 6%, transparent 60%);
    opacity: 0;
    pointer-events: none;
  }
  .tilt {
    position: relative;
    width: min(560px, calc(100vw - 32px), calc((100vh - 110px) * 0.8887));
    width: min(560px, calc(100vw - 32px), calc((100dvh - 110px) * 0.8887));
    aspect-ratio: 1182 / 1330;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .tilt > svg, .tilt > canvas { position: absolute; display: block; overflow: visible; }
  .tilt > svg { inset: 0; width: 100%; height: 100%; }
  #fx { pointer-events: none; }

  .bar {
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 24px;
    padding-block: 10px 18px;
    max-width: 960px;
    width: 100%;
    margin-inline: auto;
  }
  .cap { display: grid; gap: 2px; }
  .cap strong { font-weight: 600; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; }
  .cap span { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
  .actions { display: flex; align-items: center; gap: 16px; }
  .hint { font-size: 13px; color: var(--ink-dim); letter-spacing: .04em; }
  @media (hover: none) { .hint { display: none; } }
  #replay {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font: 600 14px/1 var(--f-ui);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink);
    background: rgba(255, 255, 255, .04);
    border: 1px solid var(--edge);
    border-radius: 999px;
    padding: 10px 16px 10px 13px;
    cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  #replay:hover { background: rgba(243, 197, 82, .1); border-color: rgba(243, 197, 82, .55); }
  #replay:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  #replay svg { width: 16px; height: 16px; }
  @media (max-width: 520px) { .bar { justify-content: center; text-align: center; } }
  html.video .bar { display: none; }
  html.video .tilt { width: calc(82vh * 0.8887); }
</style>
</head>
<body>
<main class="stage">
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="scene">
    <div class="rays" id="rays" aria-hidden="true"></div>
    <div class="tilt" id="tilt" role="img" aria-label="De Paul Public School crest: For God and Country, Rajamudy, Idukki">
      <svg id="crest" viewBox="0 0 1182 1330" aria-hidden="true"><defs id="defs"></defs></svg>
      <canvas id="globe" aria-hidden="true"></canvas>
      <svg id="fx" viewBox="0 0 1182 1330" aria-hidden="true">
        <defs>
          <linearGradient id="gShine" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset=".5" stop-color="#ffffff" stop-opacity=".55"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="gWarm">
            <stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/>
            <stop offset=".45" stop-color="#ff9a3d" stop-opacity=".25"/>
            <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
          </radialGradient>
          <filter id="fGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <path id="spark" d="M0,-30 C2.5,-5 5,-2.5 30,0 C5,2.5 2.5,5 0,30 C-2.5,5 -5,2.5 -30,0 C-5,-2.5 -2.5,-5 0,-30 Z"/>
          <mask id="mSil" maskUnits="userSpaceOnUse" x="0" y="0" width="1182" height="1330">
            <image id="silImg" x="0" y="0" width="1182" height="1330" preserveAspectRatio="none"/>
          </mask>
        </defs>
        <g mask="url(#mSil)">
          <rect id="shine" x="0" y="-60" width="260" height="1460" fill="url(#gShine)" transform="translate(-600 0)"/>
        </g>
        <circle id="glowTorch" r="70" fill="url(#gWarm)" opacity="0"/>
        <circle id="glowLamp" r="60" fill="url(#gWarm)" opacity="0"/>
        <g id="tips"></g>
        <g id="sparks"></g>
      </svg>
    </div>
  </div>

  <div class="bar">
    <div class="cap">
      <strong>De Paul Public School</strong>
      <span>Rajamudy · Idukki · For God &amp; Country</span>
    </div>
    <div class="actions">
      <span class="hint">Move your pointer to tilt the crest</span>
      <button id="replay" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Replay
      </button>
    </div>
  </div>
</main>

<script>
(async () => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const mk = (tag, attrs, parent) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(el);
    return el;
  };
  const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, p) => a + (b - a) * p;
  const E = {
    lin: p => p,
    outCubic: p => 1 - Math.pow(1 - p, 3),
    inOutCubic: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
    outBack: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
    outBackSoft: p => { const c1 = 1.1, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  };
  const { W, H, layers: L } = DATA;
  const VIDEO = new URLSearchParams(location.search).has('video');
  const about = (x, y, inner) => `translate(${x.toFixed(1)} ${y.toFixed(1)}) ${inner} translate(${(-x).toFixed(1)} ${(-y).toFixed(1)})`;

  // Decode every piece before the first frame so nothing pops in half-loaded.
  const sources = [...Object.values(L).map(l => l.src), DATA.globe.src, DATA.silhouette, DATA.halo.src];
  await Promise.all(sources.map(src => { const i = new Image(); i.src = src; return i.decode().catch(() => {}); }));

  const svg = $('crest'), defs = $('defs');
  const img = (name, parent, extra = {}) => {
    const l = L[name];
    return mk('image', { href: l.src, x: l.x, y: l.y, width: l.w, height: l.h, preserveAspectRatio: 'none', ...extra }, parent);
  };
  const group = (parent, attrs = {}) => mk('g', attrs, parent || svg);

  // Smooth a point list into a path (Catmull-Rom as cubic Béziers).
  const smoothPath = raw => {
    const pts = raw.map((p, i) => {
      const a = raw[Math.max(0, i - 1)], b = raw[Math.min(raw.length - 1, i + 1)];
      return i === 0 || i === raw.length - 1 ? p : [(a[0] + 2 * p[0] + b[0]) / 4, (a[1] + 2 * p[1] + b[1]) / 4];
    });
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  };

  const strokeMask = (id, shapes, width) => {
    const m = mk('mask', { id, maskUnits: 'userSpaceOnUse', x: -200, y: -200, width: W + 400, height: H + 400 }, defs);

      const el = s.circle
        ? mk('circle', { cx: s.circle[0], cy: s.circle[1], r: s.circle[2], transform: `rotate(-90 ${s.circle[0]} ${s.circle[1]})` }, m)

      el.setAttribute('fill', 'none'); el.setAttribute('stroke', '#fff');
      el.setAttribute('stroke-width', width); el.setAttribute('stroke-linecap', 'round'); el.setAttribute('stroke-linejoin', 'round');

      return { el, len };
    });
    return { id, els, set(p) { els.forEach(e => e.el.style.strokeDashoffset = e.len * (1 - p)); } };
  };
  const useMask = (target, mask, p) => {
    if (p >= 1) target.removeAttribute('mask'); else target.setAttribute('mask', `url(#${mask.id})`);
    mask.set(p);
  };
  const clipRect = id => {
    const cp = mk('clipPath', { id, clipPathUnits: 'userSpaceOnUse' }, defs);
    return mk('rect', { x: 0, y: -50, width: 0, height: H + 100 }, cp);
  };

  // ---------------------------------------------------------------- build the scene
  const halo = mk('image', { href: DATA.halo.src, x: DATA.halo.x, y: DATA.halo.y, width: DATA.halo.w, height: DATA.halo.h, preserveAspectRatio: 'none', opacity: 0 }, svg);
  const fill = img('fill', svg, { opacity: 0 });
  const border = img('border', svg);
  const borderMask = strokeMask('mBorder', [{ d: smoothPath(DATA.borderPaths.L) }, { d: smoothPath(DATA.borderPaths.R) }], 84);

  const laurels = ['laurelL', 'laurelR'].map(n => {
    const el = img(n, svg);
    return { el, mask: strokeMask('m' + n, [{ d: smoothPath(L[n].path) }], 190) };
  });
  const ringEl = img('ring', svg);
  const ringMask = strokeMask('mRing', [{ circle: [L.ring.cx, L.ring.cy, L.ring.r] }], 44);
  const stars = DATA.stars.map(n => ({ el: img(n, svg, { opacity: 0 }), l: L[n] }));
  const book = ['bookL', 'bookR'].map(n => ({ el: img(n, svg, { opacity: 0 }), l: L[n] }));
  const lampBase = img('lampBase', svg, { opacity: 0 });
  const lampFlame = img('lampFlame', svg, { opacity: 0 });
  const embs = ['embL', 'embR'].map(n => {
    const el = img(n, svg);
    return { el, mask: strokeMask('m' + n, [{ circle: [L[n].cx, L[n].cy, L[n].r] }], 34) };
  });
  const holder = img('torchHolder', svg, { opacity: 0 });
  const torch = img('torchFlame', svg, { opacity: 0 });
  const orings = DATA.orings.map(n => ({ el: img(n, svg, { opacity: 0 }), l: L[n] }));

  const ribbonG = group(svg, { 'clip-path': 'url(#cpRibbon)' });
  const ribbonClip = clipRect('cpRibbon');
  const ribbon = img('ribbon', ribbonG);
  const rLetters = DATA.ribbon_letters.map(n => ({ el: img(n, svg, { opacity: 0 }), l: L[n] }));
  const pLetters = DATA.place_letters.map(n => ({ el: img(n, svg, { opacity: 0 }), l: L[n] }));
  const flourishes = ['flourishL', 'flourishR'].map(n => {
    const g = group(svg, { 'clip-path': `url(#cp${n})` });
    img(n, g);
    return { rect: clipRect('cp' + n), l: L[n], side: n.endsWith('L') ? 'L' : 'R' };
  });
  const pill = img('pill', svg, { opacity: 0 });
  const bannerG = group(svg, { 'clip-path': 'url(#cpBanner)' });
  const bannerClip = clipRect('cpBanner');
  const banner = img('banner', bannerG);
  const bLetters = DATA.banner_letters.map(n => ({ el: img(n, svg, { opacity: 0 }), l: L[n] }));

  // Globe: a canvas over the SVG that re-projects the photographed globe onto a turning sphere.
  const G = DATA.globe;
  const gc = $('globe'), gctx = gc.getContext('2d');
  gc.width = gc.height = G.tsize;
  Object.assign(gc.style, {
    left: (G.x / W * 100) + '%', top: (G.y / H * 100) + '%',
    width: (G.size / W * 100) + '%', height: (G.size / H * 100) + '%',
    transformOrigin: `${G.cx / G.size * 100}% ${G.cy / G.size * 100}%`,
  });
  const texImg = new Image(); texImg.src = G.src; await texImg.decode().catch(() => {});
  const tc = document.createElement('canvas'); tc.width = tc.height = G.tsize;
  const tctx = tc.getContext('2d'); tctx.drawImage(texImg, 0, 0, G.tsize, G.tsize);
  const tex = tctx.getImageData(0, 0, G.tsize, G.tsize).data;
  const out = gctx.createImageData(G.tsize, G.tsize), od = out.data;
  const Rg = G.tr, N = G.tsize, GCX = G.tcx, GCY = G.tcy;
  const pix = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = (x + .5 - GCX) / Rg, v = (y + .5 - GCY) / Rg, r = Math.hypot(u, v);
    const a = clamp((1 - r) * Rg + .5);
    if (a <= 0) continue;
    pix.push(y * N + x, u, Math.sqrt(Math.max(0, 1 - Math.min(1, r) ** 2)), a * 255, v);
  }
  let lastTheta = null;
  const drawGlobe = theta => {
    if (lastTheta !== null && Math.abs(theta - lastTheta) < 2e-4) return;
    lastTheta = theta;
    const c = Math.cos(theta), s = Math.sin(theta);
    // The texture carries a thin white margin past the globe's rim; while turning, sample just
    // inside the rim so the margin isn't stretched across the sphere. At rest this is exact.
    const Rs = Rg - 6 * (N / G.size) * Math.abs(s);
    for (let i = 0; i < pix.length; i += 5) {
      const idx = pix[i], u = pix[i + 1], z = pix[i + 2];
      let sx = Math.round(GCX - .5 + (u * c - z * s) * Rs);
      let sy = Math.round(GCY - .5 + pix[i + 4] * Rs);
      sx = sx < 0 ? 0 : sx >= N ? N - 1 : sx;
      sy = sy < 0 ? 0 : sy >= N ? N - 1 : sy;
      const si = (sy * N + sx) * 4, oi = idx * 4;
      od[oi] = tex[si]; od[oi + 1] = tex[si + 1]; od[oi + 2] = tex[si + 2]; od[oi + 3] = pix[i + 3];
    }
    gctx.putImageData(out, 0, 0);
  };

  // Overlay effects
  $('silImg').setAttribute('href', DATA.silhouette);
  const tips = [0, 1].map(() => mk('circle', { r: 9, fill: '#ffe7a0', filter: 'url(#fGlow)', opacity: 0 }, $('tips')));
  const glowTorch = $('glowTorch'), glowLamp = $('glowLamp');
  glowTorch.setAttribute('cx', L.torchFlame.bx); glowTorch.setAttribute('cy', L.torchFlame.by - 45);
  glowLamp.setAttribute('cx', L.lampFlame.bx); glowLamp.setAttribute('cy', L.lampFlame.by - 30);

  // ---------------------------------------------------------------- timeline
  // Every track sets state from absolute time, so any moment renders directly (and Replay just resets the clock).
  const tracks = [];
  const tw = (start, dur, ease, fn) => tracks.push({ start, dur, ease: E[ease], fn });
  const setOp = (el, v) => el.setAttribute('opacity', clamp(v).toFixed(3));

  // 1. shield border draws itself from the bottom tip up both sides
  tw(0.25, 1.35, 'inOutCubic', p => {
    useMask(border, borderMask, p);
    borderMask.els.forEach((e, i) => {
      const pt = e.el.getPointAtLength(e.len * p);
      tips[i].setAttribute('cx', pt.x); tips[i].setAttribute('cy', pt.y);
    });
  });
  tw(0.25, 1.8, 'lin', q => {
    const u = q * 1.8, op = u < .12 ? u / .12 : u > 1.35 ? 1 - (u - 1.35) / .45 : 1;
    tips.forEach(t => setOp(t, op));
  });
  tw(1.3, 0.7, 'outCubic', p => setOp(fill, p));

  // 2. red ring and globe
  tw(1.45, 0.95, 'inOutCubic', p => useMask(ringEl, ringMask, p));
  let globeScale = 0;
  tw(1.5, 0.95, 'outBack', p => { globeScale = Math.max(0, p); });
  const globeTheta = t => {
    const spin = -1.05 * (1 - E.outCubic(clamp((t - 1.5) / 2.4)));
    const rock = 0.2 * Math.sin((t - 4.2) * 0.55) * clamp((t - 4.2) / 1.5);
    return spin + rock;
  };

  // 3. stars
  stars.forEach((s, i) => tw(2.0 + i * .07, .6, 'outBack', p => {
    setOp(s.el, p * 3);
    s.intro = Math.max(0, p);
  }));

  // 4. laurels grow up from the book
  tw(1.75, 1.25, 'inOutCubic', p => laurels.forEach(l => useMask(l.el, l.mask, p)));

  // 5. book opens from the spine
  tw(2.3, 0.8, 'outCubic', p => book.forEach(b => {
    setOp(b.el, p * 4);
    b.el.setAttribute('transform', `translate(0 ${lerp(24, 0, p).toFixed(1)}) ` + about(b.l.spine, 0, `scale(${Math.max(.001, p).toFixed(3)} 1)`));
  }));

  // 6. emblems
  tw(2.45, 0.7, 'inOutCubic', p => embs.forEach(e => useMask(e.el, e.mask, p)));
  tw(2.6, 0.55, 'outBackSoft', p => {
    setOp(holder, p * 2);
    holder.setAttribute('transform', `translate(0 ${lerp(26, 0, p).toFixed(1)})`);
  });
  let torchGrow = 0, lampGrow = 0;
  tw(2.8, 0.6, 'outBack', p => { torchGrow = Math.max(0, p); });
  orings.forEach((r, i) => tw(2.75 + i * .09, .5, 'outBack', p => {
    setOp(r.el, p * 3);
    r.el.setAttribute('transform', about(r.l.cx, r.l.cy, `scale(${Math.max(0, p).toFixed(3)})`));
  }));

  // 7. oil lamp
  tw(2.95, 0.6, 'outCubic', p => {
    setOp(lampBase, p * 2);
    lampBase.setAttribute('transform', about(L.lampBase.bx, L.lampBase.by, `scale(${Math.max(.001, p).toFixed(3)} 1)`));
  });
  tw(3.2, 0.6, 'outBack', p => { lampGrow = Math.max(0, p); });

  // 8. motto banner unrolls from the middle, letters drop in
  const bx0 = L.banner.x, bx1 = L.banner.x + L.banner.w, bcx = (bx0 + bx1) / 2;
  tw(2.95, 0.8, 'inOutCubic', p => {
    const w = (bx1 - bx0 + 20) * p;
    bannerClip.setAttribute('x', bcx - w / 2); bannerClip.setAttribute('width', w);
  });
  tw(2.95, 0.9, 'outBackSoft', p => bannerG.setAttribute('transform', `translate(0 ${lerp(-40, 0, p).toFixed(1)})`));
  bLetters.forEach((b, i) => tw(3.5 + i * .05, .55, 'outBack', p => {
    setOp(b.el, p * 2.5);
    b.el.setAttribute('transform', `translate(0 ${lerp(-36, 0, Math.min(1, p)).toFixed(1)}) ` + about(b.l.cx, b.l.cy, `rotate(${lerp(-18, 0, Math.min(1, p)).toFixed(1)}) scale(${lerp(.2, 1, p).toFixed(3)})`));
  }));

  // 9. school-name ribbon unrolls, letters spring up
  const rx0 = L.ribbon.x, rx1 = L.ribbon.x + L.ribbon.w, rcx = (rx0 + rx1) / 2;
  tw(3.4, 0.85, 'inOutCubic', p => {
    const w = (rx1 - rx0 + 20) * p;
    ribbonClip.setAttribute('x', rcx - w / 2); ribbonClip.setAttribute('width', w);
  });
  rLetters.forEach((r, i) => tw(4.1 + i * .045, .6, 'outBack', p => {
    setOp(r.el, p * 2.5);
    r.el.setAttribute('transform', `translate(0 ${lerp(44, 0, Math.min(1, p)).toFixed(1)}) ` + about(r.l.cx, r.l.cy, `scale(${lerp(.25, 1, p).toFixed(3)})`));
  }));

  // 10. RAJAMUDY, flourishes, IDUKKI
  pLetters.forEach((r, i) => tw(4.85 + i * .05, .5, 'outCubic', p => {
    setOp(r.el, p);
    r.el.setAttribute('transform', `translate(0 ${lerp(22, 0, p).toFixed(1)})`);
  }));
  tw(5.0, 0.9, 'inOutCubic', p => flourishes.forEach(f => {
    const w = (f.l.x1 - f.l.x0 + 30) * p;
    f.rect.setAttribute('width', w);
    f.rect.setAttribute('x', f.side === 'L' ? f.l.x1 + 15 - w : f.l.x0 - 15);
  }));
  tw(5.15, 0.6, 'outBack', p => {
    setOp(pill, p * 2);
    pill.setAttribute('transform', about(L.pill.cx, L.pill.cy, `scale(${lerp(.3, 1, p).toFixed(3)})`));
  });

  // ---------------------------------------------------------------- sparkles
  const pool = Array.from({ length: 6 }, () => mk('use', { href: '#spark', fill: '#fffaf0', filter: 'url(#fGlow)', opacity: 0 }, $('sparks')));
  const star0 = L[DATA.stars[0]];
  const INTRO = [
    [118, 185, 1.55, 1], [1062, 185, 1.6, 1], [540, 330, 2.4, .9], [216, 40, 3.65, 1], [950, 42, 3.7, 1],
    [40, 985, 4.2, 1], [1145, 985, 4.25, 1], [716, 1170, 5.6, .8], [590, 1325, 5.9, 1.1],
  ];
  const SPOTS = [[118, 185], [540, 330], [950, 42], [star0.cx, star0.cy], [216, 40], [1145, 985], [L.lampFlame.bx, L.lampFlame.by - 60], [1062, 185], [590, 1325], [40, 985], [716, 1170], [L.ring.cx, L.ring.cy - L.ring.r]];
  const drawSparks = t => {
    const live = [];
    for (const s of INTRO) if (t >= s[2] && t < s[2] + 1) live.push(s);
    if (t > 6.8) {
      const k = Math.floor((t - 6.8) / 1.1);
      for (let j = Math.max(0, k - 1); j <= k; j++) {
        const t0 = 6.8 + j * 1.1, [x, y] = SPOTS[j % SPOTS.length];
        if (t >= t0 && t < t0 + 1) live.push([x, y, t0, .8]);
      }
    }
    pool.forEach((el, i) => {
      const s = live[i];
      if (!s) { el.setAttribute('opacity', 0); return; }
      const p = t - s[2], k = Math.sin(Math.PI * p);
      el.setAttribute('opacity', k.toFixed(3));
      el.setAttribute('transform', `translate(${s[0]} ${s[1]}) rotate(${(p * 70).toFixed(1)}) scale(${(k * s[3]).toFixed(3)})`);
    });
  };

  // ---------------------------------------------------------------- ambient motion
  const rays = $('rays'), tilt = $('tilt'), shine = $('shine');
  const pointer = { x: 0, y: 0 }, lean = { x: 0, y: 0 };
  addEventListener('pointermove', e => { pointer.x = e.clientX / innerWidth * 2 - 1; pointer.y = e.clientY / innerHeight * 2 - 1; });
  document.documentElement.addEventListener('pointerleave', () => { pointer.x = pointer.y = 0; });

  const flicker = (el, l, grow, t, ph, amp = 1) => {
    if (grow <= 0) { el.setAttribute('opacity', 0); return; }
    el.setAttribute('opacity', 1);
    const sx = 1 + amp * (.035 * Math.sin(t * 11 + ph) + .02 * Math.sin(t * 17 + ph * 2));
    const sy = 1 + amp * (.06 * Math.sin(t * 9 + ph) + .03 * Math.sin(t * 23 + ph));
    const sk = amp * (3 * Math.sin(t * 7 + ph) + 1.2 * Math.sin(t * 13 + ph));
    el.setAttribute('transform', about(l.bx, l.by, `scale(${(sx * Math.min(1, grow + .2)).toFixed(3)} ${(sy * grow).toFixed(3)}) skewX(${sk.toFixed(2)})`));
  };

  const ambient = t => {
    drawGlobe(globeTheta(t));
    gc.style.transform = `scale(${globeScale.toFixed(4)})`;
    gc.style.opacity = globeScale > 0 ? 1 : 0;

    stars.forEach((s, i) => {
      const intro = s.intro || 0;
      let pulse = 0;
      if (t > 5.5) {
        const ph = ((t - 5.5 + i * .47) % 3.3) / 3.3;
        if (ph < .16) pulse = Math.sin(Math.PI * ph / .16);
      }
      s.el.setAttribute('transform', about(s.l.cx, s.l.cy, `rotate(${lerp(-144, 0, Math.min(1, intro)).toFixed(1)}) scale(${(intro * (1 + .3 * pulse)).toFixed(3)})`));
    });

    flicker(torch, L.torchFlame, torchGrow, t, 0);
    flicker(lampFlame, L.lampFlame, lampGrow, t, 1.9, .8);
    const warm = .75 + .25 * Math.sin(t * 9.3) * Math.sin(t * 5.1 + 1);
    setOp(glowTorch, torchGrow * .8 * warm);
    setOp(glowLamp, lampGrow * .9 * warm);

    const u = t - 6.0;
    const sp = u < 0 ? 0 : clamp((u % 7) / 1.3);
    shine.setAttribute('transform', `translate(${lerp(-600, W + 640, E.inOutCubic(sp)).toFixed(1)} 0) skewX(-20)`);

    setOp(halo, E.outCubic(clamp((t - 1.2) / 3)) * .75 * (.85 + .15 * Math.sin(t * 1.7)));
    rays.style.opacity = (E.outCubic(clamp((t - 1) / 2.5)) * .9).toFixed(3);
    rays.style.rotate = (t * 3).toFixed(2) + 'deg';

    if (VIDEO) {
      const k = clamp((t - 5.2) / 2);
      lean.x = .38 * Math.sin((t - 5.2) * .7) * k;
      lean.y = .22 * Math.sin((t - 5.2) * .5 + .6) * k;
    } else {
      lean.x += (pointer.x - lean.x) * .06;
      lean.y += (pointer.y - lean.y) * .06;
    }
    const bob = Math.sin(t * 1.1) * 6 * clamp((t - 5) / 1);
    const scale = lerp(.9, 1, E.outCubic(clamp(t / 5.5)));
    tilt.style.transform = `translateY(${bob.toFixed(2)}px) scale(${scale.toFixed(4)}) rotateX(${(-lean.y * 7).toFixed(2)}deg) rotateY(${(lean.x * 9).toFixed(2)}deg)`;

    drawSparks(t);
  };

  const render = t => {
    for (const k of tracks) k.fn(k.ease(clamp((t - k.start) / k.dur)));
    ambient(t);
  };

  // ---------------------------------------------------------------- drifting dust
  const cv = $('dust'), ctx = cv.getContext('2d');
  let CW = 0, CH = 0;
  const resize = () => {
    const dpr = Math.min(2, devicePixelRatio || 1);
    CW = cv.clientWidth; CH = cv.clientHeight;
    cv.width = CW * dpr; cv.height = CH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize();
  addEventListener('resize', resize);
  const motes = Array.from({ length: 70 }, () => ({
    x: Math.random(), y: Math.random(), r: .6 + Math.random() * 1.8,
    s: .004 + Math.random() * .012, ph: Math.random() * 6.283, gold: Math.random() < .45,
  }));
  const drawDust = (t, dt) => {
    ctx.clearRect(0, 0, CW, CH);
    const fade = E.outCubic(clamp(t / 2));
    for (const m of motes) {
      m.y -= m.s * dt;
      if (m.y < -.02) { m.y = 1.02; m.x = Math.random(); }
      const x = (m.x + Math.sin(t * .3 + m.ph) * .01) * CW, y = m.y * CH;
      const a = (.25 + .35 * (.5 + .5 * Math.sin(t * 1.5 + m.ph))) * fade;
      const c = m.gold ? '243,197,82' : '140,180,255';
      ctx.fillStyle = `rgba(${c},${(a * .18).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(x, y, m.r * 3.2, 0, 6.283); ctx.fill();
      ctx.fillStyle = `rgba(${c},${a.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(x, y, m.r, 0, 6.283); ctx.fill();
    }
  };

  // ---------------------------------------------------------------- run
  if (VIDEO) {
    document.documentElement.classList.add('video');
    window.__frame = (t, dt) => { render(t); drawDust(t, dt); };
    document.documentElement.dataset.ready = '1';
    return;
  }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const frozen = parseFloat(new URLSearchParams(location.search).get('t'));
  if (reduce || !isNaN(frozen)) {
    const t = isNaN(frozen) ? 9 : frozen;
    render(t); drawDust(t, 0);
    if (reduce || frozen >= 9) drawGlobe(0);
    if (reduce) $('replay').hidden = true;
    document.documentElement.dataset.ready = '1';
    return;
  }
  let start = performance.now(), last = start;
  const frame = now => {
    const t = (now - start) / 1000;
    render(t);
    drawDust(t, Math.min(.05, (now - last) / 1000));
    last = now;
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  $('replay').addEventListener('click', () => { start = performance.now(); });
  document.documentElement.dataset.ready = '1';
})();
</script>
</body>
</html>
